<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma Key Studio Pro (Editor Completo)</title>
    <script src="gif.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1e1e2e; color: #cdd6f4;
            padding: 20px; max-width: 1400px; margin: 0 auto;
        }
        
        /* Layout de 3 columnas */
        .app-layout {
            display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch;
        }
        .side-panel {
            flex: 1; min-width: 300px; max-width: 350px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .center-panel {
            flex: 2; min-width: 450px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .box {
            background: #313244; padding: 15px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .box h3 { margin: 0 0 5px 0; font-size: 15px; color: #89b4fa; border-bottom: 1px solid #45475a; padding-bottom: 5px; }
        
        .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px;}
        .col { display: flex; flex-direction: column; gap: 5px; font-size: 14px; width: 100%;}
        
        input[type="file"] { background: #45475a; color: #cdd6f4; border: none; padding: 8px 10px; border-radius: 6px; width: 100%; box-sizing: border-box;}
        input[type="range"] { width: 100%; }

        button {
            background: #89b4fa; color: #11111b; border: none; padding: 10px 15px; border-radius: 6px; 
            cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        button:hover { background: #b4befe; }
        
        #btnConfirmCrop { background: #a6e3a1; } #btnConfirmCrop:hover { background: #94e2d5; }
        #recordWebMBtn { background: #a6e3a1; } #recordWebMBtn:hover { background: #94e2d5; }
        .active-btn { background: #f38ba8 !important; color: white !important; }
        
        /* Controles de color */
        .color-tools { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
        .preset-colors { display: flex; gap: 8px; }
        .c-btn { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid #585b70; transition: transform 0.2s; }
        .c-btn:hover { transform: scale(1.1); }
        
        #nativeColorPicker {
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            width: 40px; height: 40px; background: transparent; border: none; cursor: pointer; padding: 0;
        }
        #nativeColorPicker::-webkit-color-swatch { border-radius: 8px; border: 2px solid #a6adc8; }
        #nativeColorPicker::-moz-color-swatch { border-radius: 8px; border: 2px solid #a6adc8; }
        
        #btnEyedropper { width: auto; padding: 10px; }

        /* Canvas en el centro */
        .canvas-container {
            position: relative; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAOklEQVQYV2NkYGAwYcSPAfL/////g/gM+OQZ8GvAZhg2w6jhEQ9wOAwHgzEQHw09T0OOp2HkaTgehgEACQ86HwHnLwAAAABJRU5ErkJggg==') repeat;
            border: 2px solid #45475a; border-radius: 12px; overflow: hidden;
            display: flex; justify-content: center; align-items: center; min-height: 300px; flex: 1;
        }
        #previewCanvas { max-width: 100%; max-height: 60vh; display: block; touch-action: none; cursor: pointer; }
        
        /* Diseño de la Línea de Tiempo */
        .timeline-container {
            background: #313244; padding: 15px; border-radius: 12px; user-select: none;
        }
        .timeline-track {
            position: relative; height: 35px; background: #1e1e2e; border-radius: 6px; margin-top: 5px; cursor: pointer;
        }
        .timeline-range {
            position: absolute; top: 0; bottom: 0; background: rgba(137, 180, 250, 0.2);
            border-top: 2px solid #89b4fa; border-bottom: 2px solid #89b4fa; pointer-events: none;
        }
        .timeline-handle {
            position: absolute; top: 0; width: 14px; height: 100%; background: #89b4fa;
            transform: translateX(-50%); border-radius: 4px; z-index: 10; pointer-events: none;
        }
        .timeline-handle::after {
            content: '||'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #1e1e2e; font-size: 8px; font-weight: bold; pointer-events: none;
        }
        .timeline-playhead {
            position: absolute; top: -5px; bottom: -5px; width: 2px; background: #f38ba8;
            transform: translateX(-50%); z-index: 20; pointer-events: none;
        }
        .timeline-playhead::before {
            content: ''; position: absolute; top: 0; left: -5px;
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid #f38ba8;
        }

        #status { text-align: center; font-style: italic; color: #a6adc8; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <h2 style="margin-top: 0;">Chroma Key Studio Pro</h2>
    
    <div class="app-layout">
        
        <div class="side-panel">
            <div class="box">
                <h3>1. Origen y Geometría</h3>
                <input type="file" id="videoUpload" accept="video/mp4" />
                <div class="row">
                    <button id="btnToggleCrop">✂️ Recortar Área</button>
                    <button id="btnConfirmCrop" style="display:none;">✅ Confirmar Recorte</button>
                </div>
                <div class="row" style="justify-content: flex-start; gap: 15px;">
                    <label style="cursor:pointer;"><input type="checkbox" id="flipH"> Espejo (↔)</label>
                    <label style="cursor:pointer;"><input type="checkbox" id="flipV"> Voltear (↕)</label>
                </div>
            </div>

            <div class="box">
                <h3>2. Velocidad de Reproducción</h3>
                <div class="col">
                    <div class="row">
                        <span>⏱️ Velocidad: <b id="lblSpeed">1.00x</b></span>
                        <button id="btnResetSpeed" style="width: auto; padding: 4px 10px; font-size: 12px; background: #585b70; color: #cdd6f4;">↺ Restablecer</button>
                    </div>
                    <input type="range" id="playbackSpeed" min="0.25" max="3" value="1" step="0.25">
                </div>
            </div>
        </div>

        <div class="center-panel">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="previewCanvas"></canvas>
            </div>
            
            <div class="timeline-container">
                <div class="row" style="margin-bottom: 5px;">
                    <span style="font-weight: bold; color: #cdd6f4;">Línea de Tiempo (Edición)</span>
                    <b id="lblTime" style="color: #a6adc8;">0.0s / 0.0s</b>
                </div>
                <div class="row" style="font-size: 12px; justify-content: space-between; margin-bottom: 5px;">
                    <span>Punto de Entrada: <span id="lblStart" style="color: #89b4fa; font-weight:bold;">0.0s</span></span>
                    <span>Punto de Salida: <span id="lblEnd" style="color: #89b4fa; font-weight:bold;">0.0s</span></span>
                </div>
                
                <div class="timeline-track" id="timelineTrack">
                    <div class="timeline-range" id="timelineRange"></div>
                    <div class="timeline-handle" id="handleStart"></div>
                    <div class="timeline-handle" id="handleEnd"></div>
                    <div class="timeline-playhead" id="playhead"></div>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="box">
                <h3>3. Transparencia (Chroma)</h3>
                <div class="color-tools">
                    <div class="preset-colors">
                        <div class="c-btn" style="background:#00ff00" onclick="setPreset('green', '#00ff00')" title="Verde"></div>
                        <div class="c-btn" style="background:#0000ff" onclick="setPreset('blue', '#0000ff')" title="Azul"></div>
                        <div class="c-btn" style="background:#ff0000" onclick="setPreset('red', '#ff0000')" title="Rojo"></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <input type="color" id="nativeColorPicker" value="#00ff00" title="Selector Nativo">
                        <button id="btnEyedropper" title="Usar Gotero">💉</button>
                    </div>
                </div>
                <div class="col">
                    <div class="row"><span>Fuerza / Tolerancia:</span> <b id="tolVal">50</b></div>
                    <input type="range" id="tolerance" min="0" max="200" value="50">
                </div>
            </div>

            <div class="box">
                <h3>4. Exportación Automática</h3>
                <button id="recordGifBtn">Grabar a GIF</button>
                <button id="recordWebMBtn">Grabar a WebM (Recomendado)</button>
                <span id="status">Sube un video para comenzar.</span>
            </div>
        </div>
        
    </div>

    <video id="videoSource" style="display:none;" muted playsinline loop autoplay></video>
    <canvas id="renderCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('videoSource');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctxPreview = previewCanvas.getContext('2d', { willReadFrequently: true });
        
        const renderCanvas = document.getElementById('renderCanvas');
        const ctxRender = renderCanvas.getContext('2d', { willReadFrequently: true });
        
        const tolInput = document.getElementById('tolerance');
        const flipH = document.getElementById('flipH');
        const flipV = document.getElementById('flipV');
        const statusTxt = document.getElementById('status');

        const btnToggleCrop = document.getElementById('btnToggleCrop');
        const btnConfirmCrop = document.getElementById('btnConfirmCrop');
        const btnEyedropper = document.getElementById('btnEyedropper');
        const nativePicker = document.getElementById('nativeColorPicker');
        
        const playbackSpeed = document.getElementById('playbackSpeed');
        const btnResetSpeed = document.getElementById('btnResetSpeed');

        let isRecordingGif = false, isRecordingWebM = false;
        let gif, mediaRecorder, recordedChunks = [];
        let isUserPaused = false; // Variable para rastrear la pausa voluntaria

        // Geometría
        let isCroppingMode = false;
        let crop = { x: 0, y: 0, w: 100, h: 100 };
        let isDragging = false, dragAction = null; 
        let startPos = { x: 0, y: 0 }, startCrop = { ...crop };
        const handleSize = 20;

        // Color
        let currentMode = 'green';
        let customColor = { r: 0, g: 255, b: 0 };
        let isEyedropperActive = false;
        let pendingColorPick = null;

        // --- LÓGICA DE LA LÍNEA DE TIEMPO INTERACTIVA ---
        let trimStartTime = 0;
        let trimEndTime = 100;
        let videoDuration = 0.1;
        let isDraggingTimeline = null; 
        
        let dragStartOffsetTime = 0;
        let initialTrimStart = 0;
        let initialTrimEnd = 0;

        const track = document.getElementById('timelineTrack');
        const tRange = document.getElementById('timelineRange');
        const hStart = document.getElementById('handleStart');
        const hEnd = document.getElementById('handleEnd');
        const playhead = document.getElementById('playhead');

        function updateTimelineUI() {
            if (!videoDuration || isNaN(videoDuration)) return;
            const startPct = (trimStartTime / videoDuration) * 100;
            const endPct = (trimEndTime / videoDuration) * 100;
            const currentPct = (video.currentTime / videoDuration) * 100;

            hStart.style.left = startPct + '%';
            hEnd.style.left = endPct + '%';
            tRange.style.left = startPct + '%';
            tRange.style.width = Math.max(0, endPct - startPct) + '%';
            playhead.style.left = currentPct + '%';

            document.getElementById('lblStart').innerText = trimStartTime.toFixed(1) + 's';
            document.getElementById('lblEnd').innerText = trimEndTime.toFixed(1) + 's';
            document.getElementById('lblTime').innerText = video.currentTime.toFixed(1) + 's / ' + videoDuration.toFixed(1) + 's';
        }

        function getTrackTime(e) {
            const rect = track.getBoundingClientRect();
            let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            return (x / rect.width) * videoDuration;
        }

        track.addEventListener('pointerdown', (e) => {
            if (!video.src || videoDuration <= 0.1) return;
            track.setPointerCapture(e.pointerId);
            
            const t = getTrackTime(e);
            const pxPerSec = track.getBoundingClientRect().width / videoDuration;
            
            const distStart = Math.abs(t - trimStartTime) * pxPerSec;
            const distEnd = Math.abs(t - trimEndTime) * pxPerSec;
            const distPlayhead = Math.abs(t - video.currentTime) * pxPerSec;
            
            if (distPlayhead < 15) {
                isDraggingTimeline = 'playhead';
            } else if (distStart < 15) {
                isDraggingTimeline = 'start';
            } else if (distEnd < 15) {
                isDraggingTimeline = 'end';
            } else if (t > trimStartTime && t < trimEndTime) {
                isDraggingTimeline = 'range';
                dragStartOffsetTime = t;
                initialTrimStart = trimStartTime;
                initialTrimEnd = trimEndTime;
            } else {
                isDraggingTimeline = 'playhead';
                video.currentTime = t;
            }
        });

        track.addEventListener('pointermove', (e) => {
            if (!video.src || videoDuration <= 0.1) return;
            const t = getTrackTime(e);

            if (!isDraggingTimeline) {
                const pxPerSec = track.getBoundingClientRect().width / videoDuration;
                const dStart = Math.abs(t - trimStartTime) * pxPerSec;
                const dEnd = Math.abs(t - trimEndTime) * pxPerSec;
                
                if (dStart < 15 || dEnd < 15) track.style.cursor = 'ew-resize';
                else if (t > trimStartTime && t < trimEndTime) track.style.cursor = 'grab';
                else track.style.cursor = 'pointer';
                return;
            }

            if (isDraggingTimeline === 'start') {
                trimStartTime = Math.min(t, trimEndTime - 0.1);
                video.currentTime = trimStartTime;
                track.style.cursor = 'ew-resize';
            } 
            else if (isDraggingTimeline === 'end') {
                trimEndTime = Math.max(t, trimStartTime + 0.1);
                if (video.currentTime > trimEndTime) video.currentTime = trimEndTime;
                track.style.cursor = 'ew-resize';
            } 
            else if (isDraggingTimeline === 'range') {
                track.style.cursor = 'grabbing';
                let delta = t - dragStartOffsetTime;
                let newStart = initialTrimStart + delta;
                let newEnd = initialTrimEnd + delta;
                let duration = initialTrimEnd - initialTrimStart;

                if (newStart < 0) { newStart = 0; newEnd = duration; }
                if (newEnd > videoDuration) { newEnd = videoDuration; newStart = videoDuration - duration; }

                trimStartTime = newStart;
                trimEndTime = newEnd;
                video.currentTime = trimStartTime; 
            } 
            else if (isDraggingTimeline === 'playhead') {
                video.currentTime = t;
                track.style.cursor = 'pointer';
            }
            updateTimelineUI();
        });

        track.addEventListener('pointerup', (e) => {
            isDraggingTimeline = null;
            track.style.cursor = 'pointer';
            track.releasePointerCapture(e.pointerId);
            
            // Reanudar solo si el usuario NO lo pausó voluntariamente
            if (video.paused && video.src && !isUserPaused) video.play(); 
        });

        // Velocidad
        playbackSpeed.addEventListener('input', (e) => {
            video.playbackRate = e.target.value;
            document.getElementById('lblSpeed').innerText = parseFloat(e.target.value).toFixed(2) + 'x';
        });

        btnResetSpeed.addEventListener('click', () => {
            playbackSpeed.value = 1;
            video.playbackRate = 1;
            document.getElementById('lblSpeed').innerText = '1.00x';
        });

        // Color 
        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : {r:0, g:255, b:0};
        }

        function setPreset(mode, hex) {
            currentMode = mode;
            nativePicker.value = hex;
            if (mode === 'custom') customColor = hexToRgb(hex);
        }

        nativePicker.addEventListener('input', (e) => setPreset('custom', e.target.value));
        tolInput.oninput = (e) => document.getElementById('tolVal').innerText = e.target.value;

        // Cargar Video
        document.getElementById('videoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            video.src = URL.createObjectURL(file);
            isUserPaused = false;
            video.play();
            statusTxt.innerText = "Video cargado.";
        });

        video.addEventListener('loadedmetadata', () => {
            crop.x = 0; crop.y = 0; crop.w = video.videoWidth; crop.h = video.videoHeight;
            videoDuration = video.duration;
            trimStartTime = 0; 
            trimEndTime = videoDuration;
            updateTimelineUI();
            video.play(); 
        });

        // Alternar Recorte
        btnToggleCrop.addEventListener('click', () => {
            if (!video.src) return alert('Sube un video primero.');
            isCroppingMode = true; isEyedropperActive = false; btnEyedropper.classList.remove('active-btn');
            btnToggleCrop.style.display = 'none'; btnConfirmCrop.style.display = 'block';
            previewCanvas.style.cursor = 'crosshair';
        });
        btnConfirmCrop.addEventListener('click', () => {
            isCroppingMode = false;
            btnConfirmCrop.style.display = 'none'; btnToggleCrop.style.display = 'flex';
            previewCanvas.style.cursor = 'pointer';
        });

        // Gotero
        btnEyedropper.addEventListener('click', () => {
            if (!video.src) return alert('Sube un video primero.');
            isEyedropperActive = !isEyedropperActive;
            if (isEyedropperActive) {
                btnEyedropper.classList.add('active-btn'); previewCanvas.style.cursor = 'crosshair';
            } else {
                btnEyedropper.classList.remove('active-btn'); previewCanvas.style.cursor = isCroppingMode ? 'crosshair' : 'pointer';
            }
        });

        // Eventos de interacción con el Canvas Preview
        function getPointerPos(e) {
            const rect = previewCanvas.getBoundingClientRect();
            return { x: (e.clientX - rect.left) * (previewCanvas.width / rect.width), y: (e.clientY - rect.top) * (previewCanvas.height / rect.height) };
        }

        previewCanvas.addEventListener('pointerdown', (e) => {
            const pos = getPointerPos(e);
            if (isEyedropperActive) {
                pendingColorPick = pos; isEyedropperActive = false; btnEyedropper.classList.remove('active-btn');
                previewCanvas.style.cursor = isCroppingMode ? 'crosshair' : 'pointer';
                return;
            }
            if (isCroppingMode) {
                dragAction = detectHit(pos);
                if (dragAction) {
                    isDragging = true; startPos = pos; startCrop = { ...crop };
                    previewCanvas.setPointerCapture(e.pointerId);
                }
            } else {
                // --- NUEVO: Alternar Play / Pausa si no se edita ni se usa gotero ---
                if (video.src) {
                    if (video.paused) {
                        video.play();
                        isUserPaused = false;
                    } else {
                        video.pause();
                        isUserPaused = true;
                    }
                }
            }
        });

        function detectHit(pos) {
            const { x, y, w, h } = crop;
            if (Math.abs(pos.x - x) < handleSize && Math.abs(pos.y - y) < handleSize) return 'tl';
            if (Math.abs(pos.x - (x + w)) < handleSize && Math.abs(pos.y - y) < handleSize) return 'tr';
            if (Math.abs(pos.x - x) < handleSize && Math.abs(pos.y - (y + h)) < handleSize) return 'bl';
            if (Math.abs(pos.x - (x + w)) < handleSize && Math.abs(pos.y - (y + h)) < handleSize) return 'br';
            if (pos.x > x && pos.x < x + w && pos.y > y && pos.y < y + h) return 'move';
            return null;
        }

        previewCanvas.addEventListener('pointermove', (e) => {
            if (isEyedropperActive) return;
            if (!isCroppingMode) {
                previewCanvas.style.cursor = 'pointer';
                return;
            }
            const pos = getPointerPos(e);
            if (!isDragging) {
                const hoverAction = detectHit(pos);
                previewCanvas.style.cursor = hoverAction === 'move' ? 'move' : (hoverAction ? 'crosshair' : 'default');
                return;
            }
            const dx = pos.x - startPos.x; const dy = pos.y - startPos.y;
            const vw = video.videoWidth; const vh = video.videoHeight; const minSize = 50;

            if (dragAction === 'move') { crop.x = Math.max(0, Math.min(vw - crop.w, startCrop.x + dx)); crop.y = Math.max(0, Math.min(vh - crop.h, startCrop.y + dy)); } 
            else if (dragAction === 'tl') {
                let newX = Math.max(0, Math.min(startCrop.x + dx, startCrop.x + startCrop.w - minSize));
                let newY = Math.max(0, Math.min(startCrop.y + dy, startCrop.y + startCrop.h - minSize));
                crop.w = startCrop.x + startCrop.w - newX; crop.h = startCrop.y + startCrop.h - newY; crop.x = newX; crop.y = newY;
            }
            else if (dragAction === 'tr') {
                crop.w = Math.max(minSize, Math.min(startCrop.w + dx, vw - startCrop.x));
                let newY = Math.max(0, Math.min(startCrop.y + dy, startCrop.y + startCrop.h - minSize));
                crop.h = startCrop.y + startCrop.h - newY; crop.y = newY;
            }
            else if (dragAction === 'bl') {
                let newX = Math.max(0, Math.min(startCrop.x + dx, startCrop.x + startCrop.w - minSize));
                crop.w = startCrop.x + startCrop.w - newX; crop.h = Math.max(minSize, Math.min(startCrop.h + dy, vh - startCrop.y)); crop.x = newX;
            }
            else if (dragAction === 'br') {
                crop.w = Math.max(minSize, Math.min(startCrop.w + dx, vw - startCrop.x)); crop.h = Math.max(minSize, Math.min(startCrop.h + dy, vh - startCrop.y));
            }
        });
        previewCanvas.addEventListener('pointerup', (e) => {
            isDragging = false; dragAction = null;
            if (isCroppingMode) previewCanvas.releasePointerCapture(e.pointerId);
        });

        // Procesamiento Render
        function applyChromaKey(ctx, width, height) {
            const frameData = ctx.getImageData(0, 0, width, height); const data = frameData.data; const tol = parseInt(tolInput.value);
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2]; let remove = false;
                if (currentMode === 'green') { if (g > r + tol && g > b + tol) remove = true; } 
                else if (currentMode === 'blue') { if (b > r + tol && b > g + tol) remove = true; } 
                else if (currentMode === 'red') { if (r > g + tol && r > b + tol) remove = true; } 
                else if (currentMode === 'custom') {
                    if (Math.hypot(r - customColor.r, g - customColor.g, b - customColor.b) < tol * 1.5) remove = true;
                }
                if (remove) data[i + 3] = 0;
            }
            ctx.putImageData(frameData, 0, 0);
        }

        function drawMirroredVideo(ctx, sx, sy, sw, sh, dx, dy, dw, dh) {
            ctx.save();
            if (flipH.checked || flipV.checked) {
                ctx.translate(flipH.checked ? dw : 0, flipV.checked ? dh : 0); ctx.scale(flipH.checked ? -1 : 1, flipV.checked ? -1 : 1);
                let fSx = flipH.checked ? (video.videoWidth - sx - sw) : sx; let fSy = flipV.checked ? (video.videoHeight - sy - sh) : sy;
                ctx.drawImage(video, fSx, fSy, sw, sh, 0, 0, dw, dh);
            } else { ctx.drawImage(video, sx, sy, sw, sh, dx, dy, dw, dh); }
            ctx.restore();
        }

        function handleAutoLoopAndRecording() {
            const isExporting = isRecordingGif || isRecordingWebM;
            
            // Pausar auto-loop si el usuario está interactuando con la línea de tiempo manualmente
            if (isDraggingTimeline && !isExporting) return;
            
            if (video.currentTime >= trimEndTime || video.ended) {
                if (isExporting) {
                    if (isRecordingGif) { isRecordingGif = false; statusTxt.innerText = "Renderizando GIF..."; gif.render(); }
                    if (isRecordingWebM) { isRecordingWebM = false; mediaRecorder.stop(); }
                }
                video.currentTime = trimStartTime;
                if (!video.paused) video.play(); // Solo seguir reproduciendo si no estaba en pausa
                
            } else if (video.currentTime < trimStartTime) {
                if (!isDraggingTimeline) {
                    video.currentTime = trimStartTime;
                    if (!video.paused) video.play();
                }
            }
        }

        function processFrame() {
            if (video.videoWidth === 0) {
                requestAnimationFrame(processFrame);
                return;
            }

            handleAutoLoopAndRecording();
            updateTimelineUI();

            const vw = video.videoWidth; const vh = video.videoHeight;

            if (isCroppingMode) {
                previewCanvas.width = vw; previewCanvas.height = vh;
                drawMirroredVideo(ctxPreview, 0, 0, vw, vh, 0, 0, vw, vh);
                
                if (pendingColorPick) {
                    const pixel = ctxPreview.getImageData(pendingColorPick.x, pendingColorPick.y, 1, 1).data;
                    setPreset('custom', rgbToHex(pixel[0], pixel[1], pixel[2]));
                    pendingColorPick = null;
                }

                applyChromaKey(ctxPreview, vw, vh);

                ctxPreview.fillStyle = 'rgba(0,0,0,0.6)';
                ctxPreview.fillRect(0,0,vw,crop.y); ctxPreview.fillRect(0,crop.y+crop.h,vw,vh-(crop.y+crop.h));
                ctxPreview.fillRect(0,crop.y,crop.x,crop.h); ctxPreview.fillRect(crop.x+crop.w,crop.y,vw-(crop.x+crop.w),crop.h);

                ctxPreview.strokeStyle='#fbfb8e'; ctxPreview.lineWidth=2; ctxPreview.strokeRect(crop.x,crop.y,crop.w,crop.h);
                ctxPreview.beginPath(); ctxPreview.moveTo(crop.x+crop.w/3,crop.y); ctxPreview.lineTo(crop.x+crop.w/3,crop.y+crop.h);
                ctxPreview.moveTo(crop.x+(crop.w/3)*2,crop.y); ctxPreview.lineTo(crop.x+(crop.w/3)*2,crop.y+crop.h);
                ctxPreview.moveTo(crop.x,crop.y+crop.h/3); ctxPreview.lineTo(crop.x+crop.w,crop.y+crop.h/3);
                ctxPreview.moveTo(crop.x,crop.y+(crop.h/3)*2); ctxPreview.lineTo(crop.x+crop.w,crop.y+(crop.h/3)*2); ctxPreview.stroke();

                ctxPreview.lineWidth=6; const cl=20; ctxPreview.beginPath();
                ctxPreview.moveTo(crop.x,crop.y+cl); ctxPreview.lineTo(crop.x,crop.y); ctxPreview.lineTo(crop.x+cl,crop.y);
                ctxPreview.moveTo(crop.x+crop.w-cl,crop.y); ctxPreview.lineTo(crop.x+crop.w,crop.y); ctxPreview.lineTo(crop.x+crop.w,crop.y+cl);
                ctxPreview.moveTo(crop.x,crop.y+crop.h-cl); ctxPreview.lineTo(crop.x,crop.y+crop.h); ctxPreview.lineTo(crop.x+cl,crop.y+crop.h);
                ctxPreview.moveTo(crop.x+crop.w-cl,crop.y+crop.h); ctxPreview.lineTo(crop.x+crop.w,crop.y+crop.h); ctxPreview.lineTo(crop.x+crop.w,crop.y+crop.h-cl);
                ctxPreview.stroke();
            } else {
                previewCanvas.width = crop.w; previewCanvas.height = crop.h;
                ctxPreview.clearRect(0, 0, crop.w, crop.h);
                drawMirroredVideo(ctxPreview, crop.x, crop.y, crop.w, crop.h, 0, 0, crop.w, crop.h);
                
                if (pendingColorPick) {
                    const pixel = ctxPreview.getImageData(pendingColorPick.x, pendingColorPick.y, 1, 1).data;
                    setPreset('custom', rgbToHex(pixel[0], pixel[1], pixel[2]));
                    pendingColorPick = null;
                }
                applyChromaKey(ctxPreview, crop.w, crop.h);
            }

            if (isRecordingGif || isRecordingWebM) {
                renderCanvas.width = crop.w; renderCanvas.height = crop.h;
                ctxRender.clearRect(0, 0, crop.w, crop.h);
                drawMirroredVideo(ctxRender, crop.x, crop.y, crop.w, crop.h, 0, 0, crop.w, crop.h);
                applyChromaKey(ctxRender, crop.w, crop.h);

                if (isRecordingGif && gif) gif.addFrame(ctxRender, {copy: true, delay: 1000 / (30 * video.playbackRate), transparent: 'rgba(0,0,0,0)'});
            }
            requestAnimationFrame(processFrame);
        }

        video.addEventListener('play', () => requestAnimationFrame(processFrame));

        // Exportación
        document.getElementById('recordGifBtn').addEventListener('click', (e) => {
            if (!video.src) return alert('Sube un video primero.');
            if (isRecordingWebM) return;
            const btn = e.target;
            
            if (!isRecordingGif) {
                isRecordingGif = true; btn.innerText = "Detener y Renderizar GIF"; btn.classList.add('active-btn');
                statusTxt.innerText = "Grabando frames GIF...";
                video.currentTime = trimStartTime;
                isUserPaused = false; // Quitar pausa al exportar
                video.play(); 
                
                gif = new GIF({ workers: 2, quality: 10, width: crop.w, height: crop.h, workerScript: 'gif.worker.js', transparent: "rgba(0,0,0,0)" });
                gif.on('finished', function(blob) {
                    descargar(blob, 'animacion.gif'); statusTxt.innerText = "¡GIF listo!";
                    btn.innerText = "Grabar a GIF"; btn.classList.remove('active-btn');
                });
            } else {
                isRecordingGif = false; statusTxt.innerText = "Procesando..."; gif.render();
            }
        });

        document.getElementById('recordWebMBtn').addEventListener('click', (e) => {
            if (!video.src) return alert('Sube un video primero.');
            if (isRecordingGif) return;
            const btn = e.target;
            
            if (!isRecordingWebM) {
                isRecordingWebM = true; btn.innerText = "Detener y Exportar WebM"; btn.classList.add('active-btn');
                statusTxt.innerText = "Grabando WebM...";
                video.currentTime = trimStartTime;
                isUserPaused = false; // Quitar pausa al exportar
                video.play(); 
                recordedChunks = [];

                const stream = renderCanvas.captureStream(30); 
                let options = { mimeType: 'video/webm; codecs=vp9' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm; codecs=vp8' };

                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) recordedChunks.push(ev.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    descargar(blob, 'video.webm'); statusTxt.innerText = "¡WebM listo!";
                    btn.innerText = "Grabar a WebM (Recomendado)"; btn.classList.remove('active-btn');
                };
                mediaRecorder.start();
            } else {
                isRecordingWebM = false; mediaRecorder.stop();
            }
        });

        function descargar(blob, name) {
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name;
            a.click(); URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
